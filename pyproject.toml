[project]
name = "ml-pipelines"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.26",
    "dagster-pipes>=1.13.26",
    "mlflow~=3.17.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
ml-pipelines = "ml_pipelines:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.17.0",
]
